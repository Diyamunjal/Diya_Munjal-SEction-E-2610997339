<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explore the World – Travel Agency</title>
</head>
<!-- Task 2 & 5: Divide webpage into 3 main horizontal sections -->
<frameset rows="20%, 65%, 15%" border="1" frameborder="1">
    <!-- Task 6: Using name attribute -->
    <frame src="header.html" name="headerFrame" scrolling="no" noresize>
    
    <!-- Task 3: Nested frameset dividing main content into 3 vertical columns -->
    <frameset cols="25%, 45%, 30%" border="1" frameborder="1">
        <frame src="navigation.html" name="navFrame" scrolling="auto">
        <frame src="home.html" name="contentFrame" scrolling="auto">
        <frame src="packages.html" name="packagesFrame" scrolling="auto">
    </frameset>
    
    <frame src="footer.html" name="footerFrame" scrolling="no" noresize>
</frameset>
</html>
